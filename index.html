<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>exonti</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://unpkg.com/98.css" />
    </head>

    <body>
        <header class="window">
            <form action="/"><button class="default">home</button></form>
            <form action="https://github.com/exontidev">
                <button class="default">github</button>
            </form>
        </header>

        <div id="wrapper">
            <main>
                <!-- intro -->
                <div class="window">
                    <div class="title-bar">
                        <div class="title-bar-text">a thousand greetings!</div>
                        <div class="title-bar-controls">
                            <button aria-label="Minimize"></button>
                            <button aria-label="Maximize"></button>
                            <button aria-label="Close"></button>
                        </div>
                    </div>

                    <div class="window-body">
                        <div class="divide">
                            <img
                                src="https://i.pinimg.com/1200x/1d/ff/50/1dff5055c0f3e731b2b4ebcc37352ab2.jpg"
                                alt=""
                            />

                            <div class="text">
                                <h4>who am i?</h4>
                                <p>my internet name is exontidev!</p>
                                <br />
                                <p>
                                    most of the time i spend working on backend
                                    & devops
                                </p>
                                <br />
                                <p>
                                    i'm passionate about permissionless
                                    distributed systems, such as blockchain and
                                    IPFS!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- stack -->
                <div class="window">
                    <div class="title-bar">
                        <div class="title-bar-text">stack</div>
                        <div class="title-bar-controls">
                            <button aria-label="Minimize"></button>
                            <button aria-label="Maximize"></button>
                            <button aria-label="Close"></button>
                        </div>
                    </div>

                    <div class="window-body">
                        <img
                            class="logo"
                            src="https://i.pinimg.com/736x/8c/4c/5f/8c4c5f267703d4b3ca53b5ea7697c550.jpg"
                            alt=""
                        />
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
